[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "java2uml"
version = "0.2.0"
description = "Parse Java sources: PlantUML class diagrams and StarUML (.mdj) export"
readme = "readme.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "java2uml contributors" }]
dependencies = [
    "javalang>=0.13.0",
]

[project.urls]
Homepage = "https://github.com/CircleCoder05/Java2uml"
Repository = "https://github.com/CircleCoder05/Java2uml"

[project.scripts]
java2uml = "java2uml.cli:main"
java2plantuml = "java2plantuml.cli:main"
java2staruml = "java2staruml.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["java2uml*", "java2plantuml*", "java2staruml*"]
